<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>FastAPI fixture</title></head>
<body><main><h1>FastAPI fixture</h1><p id="status">Connecting</p><ul id="items"></ul></main>
<script>
async function load(){try{const result=await Forma.api('/items');document.getElementById('status').textContent='FastAPI connected';document.getElementById('items').replaceChildren(...result.items.map(item=>{const li=document.createElement('li');li.textContent=item.title;return li}))}catch(error){document.getElementById('status').textContent=error.message}}
load();
</script></body></html>
